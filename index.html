<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEOWSERIES - หน้าแรก</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.9);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 15px;
        }
        h1.logo {
            color: #e50914;
            margin: 0;
            font-size: 22px;
            cursor: pointer;
        }
        nav {
            display: flex;
            gap: 10px;
            font-size: 14px;
            flex-wrap: wrap;
        }
        nav button {
            background: #222;
            border: 1px solid #444;
            color: #aaa;
            cursor: pointer;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        nav button.active, nav button:hover {
            background: #e50914;
            color: #fff;
            border-color: #e50914;
            font-weight: bold;
        }
        .search-box {
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            font-size: 14px;
            width: 200px;
            outline: none;
        }
        .search-box:focus {
            border-color: #e50914;
        }
        .container {
            padding: 40px;
        }
        .section-title {
            font-size: 24px;
            margin-bottom: 20px;
            border-left: 4px solid #e50914;
            padding-left: 10px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }
        .card {
            background: #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .card-content {
            padding: 12px;
        }
        .card-title {
            font-size: 14px;
            font-weight: bold;
            margin: 0 0 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-info {
            font-size: 12px;
            color: #aaa;
            margin: 0;
        }
        .no-result {
            grid-column: 1 / -1;
            text-align: center;
            color: #777;
            padding: 40px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- เมนูด้านบนและปุ่มสลับหมวดหมู่ -->
    <header>
        <h1 class="logo" onclick="loadCategory('data.json', 'อัปเดตล่าสุด', event)">MEOWSERIES</h1>
        
        <input type="text" id="searchInput" class="search-box" placeholder="ค้นหาชื่อซีรีส์ในหน้านี้..." oninput="handleSearch()">

        <nav>
            <button class="active" onclick="loadCategory('data.json', 'หน้าแรก / อัปเดตล่าสุด', event)">หน้าแรก</button>
            <button onclick="loadCategory('vertical.json', 'หนังซีรีส์จอตั้ง', event)">หนังซีรีส์จอตั้ง</button>
            <button onclick="loadCategory('cinema.json', 'หนังชนโรง', event)">หนังชนโรง</button>
            <button onclick="loadCategory('series.json', 'ซีรีส์', event)">ซีรีส์</button>
            <button onclick="loadCategory('anime.json', 'Anime / การ์ตูน', event)">Anime / การ์ตูน</button>
            <button onclick="loadCategory('adult.json', 'หนัง 18+', event)">หนัง 18+</button>
        </nav>
    </header>

    <!-- เนื้อหาหลัก -->
    <div class="container">
        <h2 id="sectionTitle" class="section-title">หน้าแรก / อัปเดตล่าสุด</h2>
        <div id="series-grid" class="grid-container">
            <!-- ข้อมูลจะถูกโหลดมาแสดงที่นี่ -->
        </div>
    </div>

    <!-- สคริปต์รองรับทั้ง groups และ stations -->
    <script>
        let allSeries = [];

        window.onload = () => {
            loadCategory('data.json', 'หน้าแรก / อัปเดตล่าสุด');
        };

        function loadCategory(jsonFile, titleText, event) {
            if (event) {
                document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
            }

            document.getElementById('searchInput').value = '';
            document.getElementById('sectionTitle').innerText = titleText;
            const grid = document.getElementById('series-grid');
            grid.innerHTML = '<div class="no-result">กำลังโหลดข้อมูล...</div>';

            fetch(jsonFile)
                .then(response => {
                    if (!response.ok) throw new Error("ไม่พบไฟล์ JSON หมวดนี้");
                    return response.json();
                })
                .then(data => {
                    let processedItems = [];

                    // รองรับโครงสร้างแบบ groups (มีหลายตอนย่อยด้านใน)
                    if (data.groups && Array.isArray(data.groups)) {
                        data.groups.forEach(group => {
                            processedItems.push({
                                name: group.name,
                                image: group.image,
                                info: "มี " + (group.stations ? group.stations.length : 0) + " ตอน",
                                stations: group.stations || []
                            });
                        });
                    } 
                    // รองรับโครงสร้างแบบ stations (แบบเดิมทีละเรื่อง)
                    else if (data.stations && Array.isArray(data.stations)) {
                        data.stations.forEach(station => {
                            processedItems.push({
                                name: station.name,
                                image: station.image,
                                info: station.info || "ไม่มีข้อมูล",
                                stations: [station]
                            });
                        });
                    }

                    allSeries = processedItems;
                    displaySeries(allSeries);
                })
                .catch(error => {
                    console.error('Error:', error);
                    grid.innerHTML = `<div class="no-result">ยังไม่ได้สร้างไฟล์ ${jsonFile} หรือไม่พบข้อมูลในหมวดนี้</div>`;
                });
        }

        function displaySeries(itemsToDisplay) {
            const grid = document.getElementById('series-grid');
            grid.innerHTML = '';

            if (itemsToDisplay.length === 0) {
                grid.innerHTML = '<div class="no-result">ไม่มีรายการในหมวดหมู่นี้</div>';
                return;
            }

            itemsToDisplay.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                card.innerHTML = `
                    <img src="${item.image}" alt="${item.name}">
                    <div class="card-content">
                        <h3 class="card-title">${item.name}</h3>
                        <p class="card-info">${item.info}</p>
                    </div>
                `;
                
                card.onclick = () => {
    // ส่งไปแค่ชื่อเรื่องและหมวดหมู่/ไฟล์
    window.location.href = `player.html?title=${encodeURIComponent(item.name)}`;
};
                
                grid.appendChild(card);
            });
        }

        function handleSearch() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const filtered = allSeries.filter(item => {
                const name = item.name ? item.name.toLowerCase() : '';
                const info = item.info ? item.info.toLowerCase() : '';
                return name.includes(keyword) || info.includes(keyword);
            });
            displaySeries(filtered);
        }
    </script>

</body>
</html>
