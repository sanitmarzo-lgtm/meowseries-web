<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Meow Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body style="background: #111; color: #fff; font-family: sans-serif; text-align: center; margin-top: 50px;">

    <h2>ระบบเล่นวิดีโอผ่าน PHP Proxy</h2>
    
    <div>
        <video id="video" controls autoplay style="width: 80%; max-width: 800px; background: #000; border-radius: 8px;"></video>
    </div>

    <script>
        const proxyBase = 'http://meowstream.gamer.gd/proxy.php?url=';

        // 🟢 ลิงก์สตรีม .m3u8 ของคุณถูกใส่ไว้ตรงนี้เรียบร้อยแล้ว
        const targetVideoUrl = 'https://raw.githubusercontent.com/stream-test/test-streams/main/x1hou/playlist.m3u8'; 

        const finalVideoUrl = proxyBase + encodeURIComponent(targetVideoUrl);

        const video = document.getElementById('video');

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(finalVideoUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = finalVideoUrl;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>

</body>
</html>
