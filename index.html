<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEOWSERIES - หน้าแรก</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* สไตล์เสริมเพื่อให้จัดเรียงรายการซีรีส์สวยงามสไตล์สตรีมมิ่ง */
        body {
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            padding: 40px;
        }
        .section-title {
            font-size: 24px;
            margin-bottom: 20px;
            border-left: 4px solid #e50914;
            padding-left: 10px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }
        .card {
            background: #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .card-content {
            padding: 12px;
        }
        .card-title {
            font-size: 14px;
            font-weight: bold;
            margin: 0 0 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-info {
            font-size: 12px;
            color: #aaa;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- ส่วนหัว / เมนูตามดีไซน์ของคุณ -->
    <header style="padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8);">
        <h1 style="color: #e50914; margin: 0; font-size: 22px;">MEOWSERIES</h1>
        <nav style="display: flex; gap: 20px; font-size: 14px;">
            <a href="#" style="color: #fff; text-decoration: none;">หน้าแรก</a>
            <a href="#" style="color: #aaa; text-decoration: none;">ซีรีส์จีน</a>
            <a href="#" style="color: #aaa; text-decoration: none;">ซับไทย / พากย์ไทย</a>
        </nav>
    </header>

    <!-- เนื้อหาหลัก -->
    <div class="container">
        <h2 class="section-title">อัปเดตล่าสุด</h2>
        
        <!-- พื้นที่แสดงรายการซีรีส์จาก data.json -->
        <div id="series-grid" class="grid-container">
            <!-- ข้อมูลจะถูกโหลดมาใส่ตรงนี้อัตโนมัติ -->
        </div>
    </div>

    <!-- สคริปต์ดึงข้อมูลจาก data.json มาแสดง -->
    <script>
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                const stations = data.stations; // ดึงข้อมูลจากก้อน stations
                const grid = document.getElementById('series-grid');
                
                stations.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    card.innerHTML = `
                        <img src="${item.image}" alt="${item.name}">
                        <div class="card-content">
                            <h3 class="card-title">${item.name}</h3>
                            <p class="card-info">${item.info}</p>
                        </div>
                    `;
                    
                    // พอกดคลิกที่การ์ดซีรีส์ จะพาไปหน้า player หรือแสดงลิงก์
                    card.onclick = () => {
    // ส่งชื่อและลิงก์ m3u8 ไปเปิดที่หน้า player.html
    window.location.href = `player.html?url=${encodeURIComponent(item.url)}&title=${encodeURIComponent(item.name)}`;
};
                    
                    grid.appendChild(card);
                });
            })
            .catch(error => console.error('เกิดข้อผิดพลาดในการโหลด data.json:', error));
    </script>

</body>
</html>
