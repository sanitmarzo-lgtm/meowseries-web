<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meowseries</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="nav-left">
            <h1 class="logo">MEOWSERIES</h1>
            <ul class="nav-links">
                <li><a href="#">หน้าแรก</a></li>
                <li><a href="#">ซีรีส์จีน</a></li>
                <li><a href="#">ซับไทย / พากย์ไทย</a></li>
            </ul>
        </div>
    </header>

    <!-- Banner / Hero Section -->
    <section class="banner" style="background: linear-gradient(to top, #141414, transparent), url('https://picsum.photos/1920/1080') center/cover;">
        <div class="banner-content">
            <h2 class="banner-title">ซีรีส์แนะนำ</h2>
            <p class="banner-desc">อัปเดตซีรีส์ใหม่ล่าสุด สนุกสุดเหวี่ยงและน่าติดตาม...</p>
            <div class="banner-buttons">
                <button class="btn play-btn">▶ เล่น</button>
                <button class="btn info-btn">ℹ ข้อมูลเพิ่มเติม</button>
            </div>
        </div>
    </section>

    <!-- Row Section (ที่ดึงข้อมูลจาก data.json) -->
    <section class="row">
        <h2>อัปเดตล่าสุด</h2>
        <div class="row-posters" id="poster-container">
            <!-- ข้อมูลจะถูกโหลดจาก data.json มาใส่ตรงนี้ -->
        </div>
    </section>

    <script>
    fetch('data.json')
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('poster-container');
            container.innerHTML = ''; 
            
            // ใช้ data.stations เพราะข้อมูลของคุณมี key ชื่อ stations ครอบไว้
            data.stations.forEach(item => {
                const poster = document.createElement('div');
                poster.className = 'poster';
                poster.style.backgroundImage = `url('${item.image}')`;
                
                // แก้ไขส่วนนี้ใน index.html
poster.onclick = () => {
    // ส่งลิงก์วิดีโอไปที่หน้า player โดยแนบ URL ไปด้วย
    window.location.href = `player.html?url=${encodeURIComponent(item.url)}`;
};
                
                container.appendChild(poster);
            });
        })
        .catch(err => console.error('Error:', err));
</script>

</body>
</html>
