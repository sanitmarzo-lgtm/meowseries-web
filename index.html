<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Meowseries Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        video { width: 100%; max-height: 450px; background: #000; border-radius: 8px; margin-bottom: 20px; }
        .episode-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        button { background: #333; color: #fff; border: 1px solid #555; padding: 10px 15px; cursor: pointer; border-radius: 5px; }
        button:hover { background: #e50914; border-color: #e50914; }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="title">กำลังโหลด...</h1>
        
        <!-- ตัวเล่นวิดีโอ -->
        <video id="video" controls autoplay></video>

        <h3>เลือกตอน</h3>
        <div class="episode-list" id="playlist"></div>
    </div>

    <script>
        const proxyBase = 'http://meowstream.gamer.gd/proxy.php';
        let hls;

        async function init() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();

                document.getElementById('title').innerText = data.groups[0].name;
                const playlistDiv = document.getElementById('playlist');

                data.groups[0].stations.forEach((station, index) => {
                    const btn = document.createElement('button');
                    btn.innerText = station.name + ' (' + station.info + ')';
                    btn.onclick = () => playVideo(station.url, station.referer);
                    playlistDiv.appendChild(btn);

                    // เล่น EP แรกเป็นค่าเริ่มต้น
                    if (index === 0) {
                        playVideo(station.url, station.referer);
                    }
                });

            } catch (error) {
                console.error("โหลดข้อมูล JSON ไม่สำเร็จ:", error);
            }
        }

        function playVideo(url, referer) {
            const video = document.getElementById('video');
            const finalUrl = `${proxyBase}?url=${encodeURIComponent(url)}&referer=${encodeURIComponent(referer)}`;

            if (Hls.isSupported()) {
                if (hls) {
                    hls.destroy();
                }
                hls = new Hls();
                hls.loadSource(finalUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = finalUrl;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }

        init();
    </script>

</body>
</html>
