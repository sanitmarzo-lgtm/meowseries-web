<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meowseries Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #121212; color: #ffffff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        video { width: 100%; max-height: 450px; background: #000; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { margin-bottom: 10px; }
        .group-section { margin-top: 20px; text-align: left; }
        .group-title { color: #ff4757; border-bottom: 2px solid #ff4757; padding-bottom: 5px; margin-bottom: 10px; }
        .episode-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
        button { background: #2f3542; color: #fff; border: none; padding: 12px; cursor: pointer; border-radius: 5px; transition: 0.3s; }
        button:hover { background: #ff4757; }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="main-title">กำลังโหลดข้อมูลซีรีส์...</h1>
        <video id="video" controls autoplay></video>

        <div id="playlist"></div>
    </div>

    <script>
        const proxyBase = 'http://meowstream.gamer.gd/proxy.php';
        let hls;

        async function init() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();

                document.getElementById('main-title').innerText = data.name;
                const playlistDiv = document.getElementById('playlist');

                // วนลูปกลุ่มซีรีส์
                data.groups.forEach(group => {
                    const section = document.createElement('div');
                    section.className = 'group-section';
                    
                    const title = document.createElement('h3');
                    title.className = 'group-title';
                    title.innerText = group.name;
                    section.appendChild(title);

                    const list = document.createElement('div');
                    list.className = 'episode-list';

                    // วนลูปตอนภายในกลุ่ม
                    group.stations.forEach((station) => {
                        const btn = document.createElement('button');
                        btn.innerText = station.name;
                        btn.onclick = () => playVideo(station.url, station.referer);
                        list.appendChild(btn);
                    });

                    section.appendChild(list);
                    playlistDiv.appendChild(section);
                });
            } catch (error) {
                console.error("โหลดข้อมูล JSON ไม่สำเร็จ:", error);
                document.getElementById('main-title').innerText = "ไม่พบไฟล์ data.json";
            }
        }

        function playVideo(url, referer) {
            const video = document.getElementById('video');
            const finalUrl = `${proxyBase}?url=${encodeURIComponent(url)}&referer=${encodeURIComponent(referer)}`;

            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls();
                hls.loadSource(finalUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = finalUrl;
                video.addEventListener('loadedmetadata', () => video.play());
            }
        }

        init();
    </script>
</body>
</html>
