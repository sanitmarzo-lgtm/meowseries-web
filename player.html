<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeowSeries Player</title>
    <!-- นำเข้า Hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            margin: 0;
            background-color: #141414;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .player-container {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16/9;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <video id="video" controls autoplay></video>
    </div>

    <script>
        // ดึง URL ของวิดีโอจาก Query Parameter ชื่อ ?url= หรือ ?stream=
        const urlParams = new URLSearchParams(window.location.search);
        let streamUrl = urlParams.get('url') || urlParams.get('stream');

        if (!streamUrl) {
            alert('ไม่พบลิงก์วิดีโอสำหรับเล่น');
        } else {
            var video = document.getElementById('video');

            if (Hls.isSupported()) {
                var hls = new Hls({
                    // ฟังก์ชันดักจับทุก Request ที่ Hls.js สร้างขึ้นเพื่อดึงไฟล์ย่อย (.ts หรือ .m3u8)
                    xhrSetup: function (xhr, url) {
                        if (!url.includes('meow-stream-proxy.sarawutocha.workers.dev')) {
                            let absoluteUrl = url;
                            if (url.startsWith('/')) {
                                absoluteUrl = 'https://m35.999play4.com' + url;
                            } else if (!url.startsWith('http://') && !url.startsWith('https://')) {
                                absoluteUrl = 'https://m35.999play4.com/' + url;
                            }
                            url = 'https://meow-stream-proxy.sarawutocha.workers.dev/?url=' + encodeURIComponent(absoluteUrl);
                        }
                        xhr.open('GET', url, true);
                    }
                });
                
                // แปลง streamUrl หลักให้อยู่ในรูป Absolute URL ก่อนส่งเข้า Proxy
                let finalStreamUrl = streamUrl;
                if (streamUrl.startsWith('/')) {
                    finalStreamUrl = 'https://m35.999play4.com' + streamUrl;
                } else if (!streamUrl.startsWith('http://') && !streamUrl.startsWith('https://')) {
                    finalStreamUrl = 'https://m35.999play4.com/' + streamUrl;
                }

                hls.loadSource('https://meow-stream-proxy.sarawutocha.workers.dev/?url=' + encodeURIComponent(finalStreamUrl));
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(e => {
                        console.log("Autoplay blocked or failed:", e);
                    });
                });

                // ระบบจัดการ Error ป้องกันวิดีโอหลุดหรือโหลดค้าง
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        console.error('HLS Fatal Error:', data.type, data.details);
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                hls.destroy();
                                break;
                        }
                    }
                });

            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // สำหรับ Safari หรือเบราว์เซอร์ที่รองรับ HLS Native
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }
    </script>
</body>
</html>
