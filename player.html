<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeowSeries Direct Player</title>
    <style>
        body {
            margin: 0;
            background-color: #141414;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1f1f1f;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .info-text {
            margin-bottom: 15px;
            font-size: 0.95rem;
            color: #aaa;
            text-align: center;
        }
        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
        }
        .ep-btn {
            background-color: #2f2f2f;
            color: white;
            border: none;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .ep-btn:hover {
            background-color: #e50914;
        }
    </style>
</head>
<body>

    <h1 id="movie-title">กำลังโหลด...</h1>
    
    <div class="container">
        <div class="info-text">คลิกเลือกตอนเพื่อเปิดเล่นวิดีโอแบบเต็มจอ</div>
        <div class="episode-grid" id="episode-list"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const titleParam = urlParams.get('title') || 'ซีรีส์ของฉัน';
        document.getElementById('movie-title').innerText = titleParam;

        async function loadEpisodes() {
            const jsonFiles = ['series.json', 'anime.json', 'cinema.json', 'vertical.json', 'adult.json'];
            let foundStations = [];
            const epListContainer = document.getElementById('episode-list');
            epListContainer.innerHTML = '<div style="color:#aaa; grid-column: 1/-1; text-align:center;">กำลังค้นหาตอน...</div>';

            for (let file of jsonFiles) {
                try {
                    let response = await fetch(file);
                    if (response.ok) {
                        let data = await response.json();
                        if (data.groups && Array.isArray(data.groups)) {
                            let match = data.groups.find(g => g.name === titleParam);
                            if (match && match.stations) {
                                foundStations = match.stations;
                                break;
                            }
                        }
                        if (data.stations && Array.isArray(data.stations)) {
                            let match = data.stations.filter(s => s.name === titleParam);
                            if (match.length > 0) {
                                foundStations = match;
                                break;
                            }
                        }
                    }
                } catch (e) {}
            }

            epListContainer.innerHTML = '';

            if (foundStations.length === 0) {
                epListContainer.innerHTML = '<div style="color:#e50914; grid-column: 1/-1; text-align:center;">ไม่พบข้อมูลสตรีมมิ่ง</div>';
                document.getElementById('movie-title').innerText = titleParam + " (ไม่พบลิงก์)";
                return;
            }

            foundStations.forEach((station, index) => {
                const btn = document.createElement('button');
                btn.className = 'ep-btn';
                
                let epLabel = 'EP ' + (index + 1);
                if (station.info && !station.info.includes('เสียง')) {
                    epLabel = station.info.replace('ตอนที่', 'EP');
                }
                btn.innerText = epLabel;
                
                btn.onclick = function() {
                    let finalStreamUrl = station.url;
                    if (!finalStreamUrl.startsWith('http://') && !finalStreamUrl.startsWith('https://')) {
                        if (finalStreamUrl.startsWith('/')) {
                            finalStreamUrl = 'https://main.24playerhd.com' + finalStreamUrl;
                        } else {
                            finalStreamUrl = 'https://main.24playerhd.com/' + finalStreamUrl;
                        }
                    }

                    // เปิดผ่านตัวเล่นออนไลน์มาตรฐานโดยส่งลิงก์ตรงไป
                    const playerUrl = "https://hls-player.net/?url=" + encodeURIComponent(finalStreamUrl);
                    window.open(playerUrl, '_blank');
                };

                epListContainer.appendChild(btn);
            });
        }

        loadEpisodes();
    </script>
</body>
</html>
