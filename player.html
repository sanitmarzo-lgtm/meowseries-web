<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEOWSERIES - เล่นวิดีโอ</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h2#title {
            font-size: 20px;
            margin-bottom: 15px;
            color: #fff;
        }
        .player-container {
            display: flex;
            gap: 20px;
            flex: 1;
            max-height: calc(100vh - 80px);
        }
        .video-box {
            flex: 3;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .playlist-box {
            flex: 1;
            background: #1a1a1a;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 250px;
        }
        .playlist-box h3 {
            font-size: 16px;
            margin: 0 0 10px 0;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        .ep-btn {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            text-align: left;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .ep-btn:hover, .ep-btn.active {
            background: #e50914;
            border-color: #e50914;
        }
        .open-link-btn {
            background: #e50914;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            margin-top: 15px;
            display: inline-block;
        }
        .open-link-btn:hover {
            background: #b20710;
        }
    </style>
</head>
<body>

    <h2 id="title">กำลังโหลดข้อมูล...</h2>

    <div class="player-container">
        <div class="video-box" id="infoBox">
            <h3>เลือกตอนที่ต้องการรับชมจากเมนูด้านขวา</h3>
            <p style="color: #aaa; font-size: 14px;">ระบบจะสร้างลิงก์รับชมผ่าน Player เสถียรให้ทันที</p>
        </div>

        <div class="playlist-box">
            <h3>เลือกตอน</h3>
            <div id="episodesContainer" style="display: flex; flex-direction: column; gap: 8px;">
                <p style="color: #777; font-size: 14px;">กำลังโหลดรายชื่อตอน...</p>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const targetTitle = urlParams.get('title') ? decodeURIComponent(urlParams.get('title')) : '';

        const titleElement = document.getElementById('title');
        if (titleElement) {
            titleElement.innerText = targetTitle;
        }

        const epContainer = document.getElementById('episodesContainer');
        const infoBox = document.getElementById('infoBox');

        fetch('series.json')
            .then(response => response.json())
            .then(data => {
                let foundGroup = null;

                if (data.groups) {
                    foundGroup = data.groups.find(g => g.name === targetTitle);
                }

                if (foundGroup && foundGroup.stations) {
                    epContainer.innerHTML = '';
                    
                    foundGroup.stations.forEach((epItem, index) => {
                        const btn = document.createElement('button');
                        btn.className = 'ep-btn';
                        btn.innerText = epItem.name || `EP ${index + 1}`;
                        
                        // สร้างลิงก์ Player สำเร็จรูปผ่าน hlsjs player หรือส่งเข้าเว็บเล่นไฟล์ hls ออนไลน์เพื่อความชัวร์
                        // หรือเปิดผ่าน Player กลางที่รันไฟล์ m3u8 ได้ทันที
                        const playerUrl = `https://vidstack.io/player?src=${encodeURIComponent(epItem.url)}`;

                        btn.onclick = () => {
                            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                            
                            infoBox.innerHTML = `
                                <h3 style="margin-bottom: 5px;">กำลังเล่น: ${epItem.name || 'EP ' + (index + 1)}</h3>
                                <p style="color: #888; font-size: 13px; margin-bottom: 15px;">คลิกปุ่มด้านล่างเพื่อเปิดหน้าต่างเล่นวิดีโอแบบคมชัด HD</p>
                                <a href="${playerUrl}" target="_blank" class="open-link-btn">▶ เปิดเครื่องเล่นวิดีโอ (Player)</a>
                            `;

                            window.open(playerUrl, '_blank');
                        };

                        epContainer.appendChild(btn);

                        if (index === 0) {
                            btn.classList.add('active');
                            infoBox.innerHTML = `
                                <h3 style="margin-bottom: 5px;">พร้อมรับชม: ${epItem.name || 'EP 1'}</h3>
                                <p style="color: #888; font-size: 13px; margin-bottom: 15px;">คลิกปุ่มด้านล่างเพื่อเริ่มรับชม</p>
                                <a href="${playerUrl}" target="_blank" class="open-link-btn">▶ เปิดเครื่องเล่นวิดีโอ (Player)</a>
                            `;
                        }
                    });
                } else {
                    epContainer.innerHTML = '<p style="color: #e50914; font-size: 14px;">ไม่พบข้อมูลตอนของซีรีส์นี้</p>';
                }
            })
            .catch(err => {
                console.error("Load JSON Error:", err);
                epContainer.innerHTML = '<p style="color: #e50914; font-size: 14px;">เกิดข้อผิดพลาดในการโหลดไฟล์ JSON</p>';
            });
    </script>
</body>
</html>
