<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Meowseries Player</title>
    <!-- ใช้ HLS.js เพื่อให้เล่น .m3u8 บนเบราว์เซอร์ได้ -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        video { width: 90%; max-width: 900px; }
    </style>
</head>
<body>
    <video id="video" controls autoplay></video>

    <script>
        const video = document.getElementById('video');
        // รับค่า URL จาก parameter ที่ส่งมา (เช่น player.html?url=...)
        const urlParams = new URLSearchParams(window.location.search);
        const videoSrc = urlParams.get('url');

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
        }
    </script>
</body>
</html>
