<script>
        const urlParams = new URLSearchParams(window.location.search);
        const titleParam = urlParams.get('title') || 'ซีรีส์ของฉัน';
        document.getElementById('movie-title').innerText = titleParam;

        var video = document.getElementById('video');
        var currentHls = null;

        function playVideo(streamUrl, buttonElement) {
            document.querySelectorAll('.ep-btn').forEach(btn => btn.classList.remove('active'));
            if (buttonElement) buttonElement.classList.add('active');

            if (currentHls) {
                currentHls.destroy();
                currentHls = null;
            }

            let finalStreamUrl = streamUrl;
            if (streamUrl.startsWith('/')) {
                finalStreamUrl = 'https://m35.999play4.com' + streamUrl;
            } else if (!streamUrl.startsWith('http://') && !streamUrl.startsWith('https://')) {
                finalStreamUrl = 'https://m35.999play4.com/' + streamUrl;
            }

            const proxyUrl = 'https://meow-stream-proxy.sarawutocha.workers.dev/?url=' + encodeURIComponent(finalStreamUrl);

            if (Hls.isSupported()) {
                var hls = new Hls({
                    xhrSetup: function (xhr, url) {
                        if (!url.includes('meow-stream-proxy.sarawutocha.workers.dev')) {
                            let absoluteUrl = url;
                            if (url.startsWith('/')) {
                                absoluteUrl = 'https://m35.999play4.com' + url;
                            } else if (!url.startsWith('http://') && !url.startsWith('https://')) {
                                absoluteUrl = 'https://m35.999play4.com/' + url;
                            }
                            url = 'https://meow-stream-proxy.sarawutocha.workers.dev/?url=' + encodeURIComponent(absoluteUrl);
                        }
                        xhr.open('GET', url, true);
                    }
                });
                
                hls.loadSource(proxyUrl);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(error => {
                        console.log("Autoplay prevented by browser policy, click play to start.");
                    });
                });

                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break;
                            case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
                            default: hls.destroy(); break;
                        }
                    }
                });
                currentHls = hls;
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = proxyUrl;
                video.addEventListener('loadedmetadata', function() {
                    video.play().catch(error => {
                        console.log("Autoplay prevented by browser policy.");
                    });
                });
            }
        }

        async function loadEpisodes() {
            const jsonFiles = ['series.json', 'anime.json', 'cinema.json', 'vertical.json', 'adult.json'];
            let foundStations = [];

            const epListContainer = document.getElementById('episode-list');
            epListContainer.innerHTML = '<div style="color:#aaa; grid-column: 1/-1;">กำลังค้นหาตอน...</div>';

            for (let file of jsonFiles) {
                try {
                    let response = await fetch(file);
                    if (response.ok) {
                        let data = await response.json();
                        
                        if (data.groups && Array.isArray(data.groups)) {
                            let match = data.groups.find(g => g.name === titleParam);
                            if (match && match.stations) {
                                foundStations = match.stations;
                                break;
                            }
                        }
                        if (data.stations && Array.isArray(data.stations)) {
                            let match = data.stations.filter(s => s.name === titleParam);
                            if (match.length > 0) {
                                foundStations = match;
                                break;
                            }
                        }
                    }
                } catch (e) {
                    console.log(`ข้ามไฟล์ ${file} เนื่องจากยังไม่พร้อมใช้งาน`);
                }
            }

            epListContainer.innerHTML = '';

            if (foundStations.length === 0) {
                epListContainer.innerHTML = '<div style="color:#e50914; grid-column: 1/-1;">ไม่พบข้อมูลสตรีมมิ่งของเรื่องนี้</div>';
                document.getElementById('movie-title').innerText = titleParam + " (ไม่พบลิงก์)";
                return;
            }

            let firstButton = null;

            foundStations.forEach((station, index) => {
                const btn = document.createElement('button');
                btn.className = 'ep-btn';
                btn.innerText = station.info ? station.info.replace('ตอนที่', 'EP') : 'EP ' + (index + 1);
                
                btn.onclick = function() {
                    playVideo(station.url, btn);
                };
                epListContainer.appendChild(btn);

                // เก็บปุ่มแรกไว้สั่งเล่นรอบเดียวจบ ป้องกันการเรียกซ้ำซ้อน
                if (index === 0) {
                    firstButton = btn;
                }
            });

            // สั่งเล่นตอนแรกแค่ครั้งเดียวหลังจากสร้างปุ่มครบทั้งหมดแล้ว
            if (foundStations.length > 0 && firstButton) {
                playVideo(foundStations[0].url, firstButton);
            }
        }

        loadEpisodes();
    </script>
