<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEOWSERIES - เล่นวิดีโอ</title>
    <!-- โหลดไลบรารี Hls.js สำหรับเล่นไฟล์ .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h2#title {
            font-size: 20px;
            margin-bottom: 15px;
            color: #fff;
        }
        .player-container {
            display: flex;
            gap: 20px;
            flex: 1;
            max-height: calc(100vh - 80px);
        }
        .video-box {
            flex: 3;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            max-height: calc(100vh - 120px);
            background: #000;
            outline: none;
        }
        .playlist-box {
            flex: 1;
            background: #1a1a1a;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 250px;
        }
        .playlist-box h3 {
            font-size: 16px;
            margin: 0 0 10px 0;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        .ep-btn {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            text-align: left;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .ep-btn:hover, .ep-btn.active {
            background: #e50914;
            border-color: #e50914;
        }
    </style>
</head>
<body>

    <h2 id="title">กำลังโหลดข้อมูล...</h2>

    <div class="player-container">
        <div class="video-box">
            <!-- แท็กวิดีโอหลักสำหรับเล่นสตรีม -->
            <video id="videoPlayer" controls autoplay></video>
        </div>

        <div class="playlist-box">
            <h3>เลือกตอน</h3>
            <div id="episodesContainer" style="display: flex; flex-direction: column; gap: 8px;">
                <p style="color: #777; font-size: 14px;">กำลังโหลดรายชื่อตอน...</p>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const targetTitle = urlParams.get('title') ? decodeURIComponent(urlParams.get('title')) : '';

        const titleElement = document.getElementById('title');
        if (titleElement) {
            titleElement.innerText = targetTitle;
        }

        const video = document.getElementById('videoPlayer');
        const epContainer = document.getElementById('episodesContainer');
        let currentHls = null; // ตัวแปรเก็บสถานะ HLS เพื่อทำลายและสร้างใหม่เวลาเปลี่ยนตอนอย่างสะอาด

        function playStream(url) {
            // หากมี HLS ค้างอยู่ ให้ทำลายทิ้งก่อนเพื่อป้องกันปัญหาชนกัน
            if (currentHls) {
                currentHls.destroy();
                currentHls = null;
            }

            if (Hls.isSupported()) {
                currentHls = new Hls();
                currentHls.loadSource(url);
                currentHls.attachMedia(video);
                currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("User interaction required to play:", e));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(e => console.log("User interaction required to play:", e));
                }, { once: true });
            }
        }

        fetch('series.json')
            .then(response => response.json())
            .then(data => {
                let foundGroup = null;

                if (data.groups) {
                    foundGroup = data.groups.find(g => g.name === targetTitle);
                }

                if (foundGroup && foundGroup.stations && foundGroup.stations.length > 0) {
                    epContainer.innerHTML = '';
                    
                    foundGroup.stations.forEach((epItem, index) => {
                        const btn = document.createElement('button');
                        btn.className = 'ep-btn';
                        btn.innerText = epItem.name || `EP ${index + 1}`;
                        
                        btn.onclick = () => {
                            document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                            playStream(epItem.url);
                        };

                        epContainer.appendChild(btn);
                    });

                    // โหลดตอนแรกเตรียมไว้โดยใช้ปุ่มแรก (เซ็ต Active และโหลดซอร์สครั้งเดียวจบ ไม่ซ้ำซ้อน)
                    const firstBtn = epContainer.querySelector('.ep-btn');
                    if (firstBtn) {
                        firstBtn.classList.add('active');
                    }
                    
                    // โหลดซอร์สตอนแรกแบบนิ่งๆ ไม่บังคับสั่ง play() ตอนเปิดหน้าเว็บทันที
                    if (Hls.isSupported()) {
                        currentHls = new Hls();
                        currentHls.loadSource(foundGroup.stations[0].url);
                        currentHls.attachMedia(video);
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = foundGroup.stations[0].url;
                    }

                } else {
                    epContainer.innerHTML = '<p style="color: #e50914; font-size: 14px;">ไม่พบข้อมูลตอนของซีรีส์นี้</p>';
                }
            })
            .catch(err => {
                console.error("Load JSON Error:", err);
                epContainer.innerHTML = '<p style="color: #e50914; font-size: 14px;">เกิดข้อผิดพลาดในการโหลดไฟล์ JSON</p>';
            });
    </script>
</body>
</html>
