<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeowSeries Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            margin: 0;
            background-color: #141414;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .player-container {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16/9;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <video id="video" controls autoplay></video>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        
        // 1. ลองดึงจาก url หรือ stream ก่อนตามปกติ
        let streamUrl = urlParams.get('url') || urlParams.get('stream') || urlParams.get('src');

        // 2. ถ้าไม่มี แต่มีพารามิเตอร์ ?title= ส่งมา (แบบที่เว็บหลักคุณใช้อยู่) 
        // ให้เราสร้างโครงสร้างลิงก์ .m3u8 ขึ้นมาจากชื่อเรื่องหรือรหัสวิดีโอที่มีอยู่จริง
        if (!streamUrl) {
            const titleParam = urlParams.get('title');
            if (titleParam) {
                // ตัวอย่าง: ถ้าหน้าหลักส่งมาแค่ชื่อเรื่อง ให้ดึงแฮชหรือลิงก์จริงมาต่อตรงนี้
                // หรือถ้าคุณมีรูปแบบลิงก์ตายตัวของเว็บสตรีมมิ่ง สามารถประกอบร่างตรงนี้ได้เลยครับ
                // เช่น ดึงค่าจากเว็บ m35.999play4.com ตามแฮชเดิมของคุณ:
                streamUrl = 'https://m35.999play4.com/m3u8/8830a3bb800ddafff1820c3e/8830a3bb800ddafff1820c3e168.m3u8';
            }
        }

        if (!streamUrl) {
            alert('ไม่พบลิงก์วิดีโอสำหรับเล่น');
        } else {
            var video = document.getElementById('video');

            if (Hls.isSupported()) {
                var hls = new Hls({
                    xhrSetup: function (xhr, url) {
                        if (!url.includes('meow-stream-proxy.sarawutocha.workers.dev')) {
                            let absoluteUrl = url;
                            if (url.startsWith('/')) {
                                absoluteUrl = 'https://m35.999play4.com' + url;
                            } else if (!url.startsWith('http://') && !url.startsWith('https://')) {
                                absoluteUrl = 'https://m35.999play4.com/' + url;
                            }
                            url = 'https://meow-stream-proxy.sarawutocha.workers.dev/?url=' + encodeURIComponent(absoluteUrl);
                        }
                        xhr.open('GET', url, true);
                    }
                });
                
                let finalStreamUrl = streamUrl;
                if (streamUrl.startsWith('/')) {
                    finalStreamUrl = 'https://m35.999play4.com' + streamUrl;
                } else if (!streamUrl.startsWith('http://') && !streamUrl.startsWith('https://')) {
                    finalStreamUrl = 'https://m35.999play4.com/' + streamUrl;
                }

                hls.loadSource('https://meow-stream-proxy.sarawutocha.workers.dev/?url=' + encodeURIComponent(finalStreamUrl));
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(e => {
                        console.log("Autoplay blocked or failed:", e);
                    });
                });

                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        console.error('HLS Fatal Error:', data.type, data.details);
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                hls.destroy();
                                break;
                        }
                    }
                });

            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }
    </script>
</body>
</html>
