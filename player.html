<script>
        const urlParams = new URLSearchParams(window.location.search);
        const encodedData = urlParams.get('data'); 
        const videoTitle = urlParams.get('title');

        if (videoTitle) {
            document.getElementById('title').innerText = decodeURIComponent(videoTitle);
        }

        const video = document.getElementById('videoPlayer');
        const epContainer = document.getElementById('episodesContainer');

        if (encodedData) {
            // แปลงข้อมูลซีรีส์กลับมาเป็น Object
            const seriesData = JSON.parse(decodeURIComponent(encodedData));

            // เช็คว่ามีรายการตอนใน stations หรือไม่ (รองรับโครงสร้าง groups ของคุณ)
            const episodes = seriesData.stations || seriesData.episodes;

            if (episodes && episodes.length > 0) {
                episodes.forEach((epItem, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'ep-btn';
                    btn.innerText = epItem.name || epItem.ep; // ดึงชื่อตอนมาแสดง
                    
                    btn.onclick = () => {
                        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        
                        playVideo(epItem.url); // เล่นลิงก์ m3u8 ของตอนนี้
                    };

                    epContainer.appendChild(btn);

                    // กดเล่นตอนแรกให้อัตโนมัติเมื่อเปิดหน้าเว็บ
                    if (index === 0) {
                        btn.click();
                    }
                });
            }
        }

        function playVideo(videoUrl) {
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(videoUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = videoUrl;
                video.play();
            } else {
                video.src = videoUrl;
                video.play();
            }
        }
    </script>
