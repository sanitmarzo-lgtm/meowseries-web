<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>MEOWSERIES - Player</title>
    <style>
        body { background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        h2 { margin-bottom: 15px; font-size: 20px; }
        video { width: 90%; max-width: 900px; border-radius: 8px; background: #111; }
    </style>
</head>
<body>
    <h2 id="title">กำลังโหลด...</h2>
    <video id="videoPlayer" controls autoplay></video>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('url');
        const videoTitle = urlParams.get('title');

        if (videoTitle) {
            document.getElementById('title').innerText = videoTitle;
        }

        const video = document.getElementById('videoPlayer');
        
        // ทดลองเล่นตรงๆ ไม่ผ่าน Proxy 
        // ถ้าเบราว์เซอร์ยอมให้โหลดข้ามโดเมน วิธีนี้จะเล่นได้ทันที
        if (videoUrl) {
            video.src = videoUrl;
            video.play().catch(e => {
                console.log("Auto-play blocked or source issue, user needs to click play.");
            });
        }
    </script>
</body>
</html>
